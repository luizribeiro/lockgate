[package]
name = "lockgate-http"
version.workspace = true
edition.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytes = { version = "1.11.1", default-features = false }
http.workspace = true
http-body-util = "0.1.3"
# Declared directly: stable cargo forbids disabling default features on
# workspace-inherited dependencies, and these guest builds must stay no-default.
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
wasip3 = { version = "0.7.0", features = ["http-compat"] }
wit-bindgen = { version = "0.57", default-features = false, features = ["async"] }
