[workspace]
resolver = "3"
members = [
    "config-guest",
    "detached-jobs-guest",
    "exec-concurrent-guest",
    "exec-fuel-guest",
    "exec-guest",
    "host-bindings-guest",
    "host-export-values",
    "host-export-values-guest",
    "public-guest",
    "renamed-facade",
    "renamed-host-facade",
    "typed-settings-guest",
]

[workspace.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
futures = { version = "0.3", default-features = false }
wit-bindgen = { version = "0.57", default-features = false }
