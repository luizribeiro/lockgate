[package]
name = "lockgate"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
jsonschema = { version = "0.49.2", default-features = false }
lockgate-schema = { version = "0.1.0", path = "../lockgate-schema" }
lockgate-macros = { version = "0.1.0", path = "../lockgate-macros" }
lockgate-policy = { version = "0.1.0", path = "../lockgate-policy" }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
wasmparser.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
wit-parser.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
trybuild = "1"
wasm-encoder.workspace = true
wit-component = { workspace = true, features = ["dummy-module"] }
wat.workspace = true
