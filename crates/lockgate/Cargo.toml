[package]
name = "lockgate"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
http.workspace = true
jsonschema = { version = "0.49.2", default-features = false }
lockgate-schema = { version = "0.1.0", path = "../lockgate-schema" }
lockgate-macros = { version = "0.1.0", path = "../lockgate-macros" }
lockgate-policy = { version = "0.1.0", path = "../lockgate-policy" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
wasmparser.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
wit-parser.workspace = true

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
trybuild = "1"
wasm-encoder.workspace = true
wit-component = { workspace = true, features = ["dummy-module"] }
wat.workspace = true
