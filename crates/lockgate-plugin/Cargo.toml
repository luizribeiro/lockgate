[package]
name = "lockgate-plugin"
version.workspace = true
edition.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:dlmalloc"]

[dependencies]
lockgate-policy = { version = "0.1.0", path = "../lockgate-policy" }
lockgate-plugin-macros = { version = "0.1.0", path = "../lockgate-plugin-macros" }
schemars.workspace = true
# Declared directly: stable cargo forbids disabling default features on
# workspace-inherited dependencies, and these guest builds must stay no-default.
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
wit-bindgen = { version = "0.57", default-features = false, features = ["async", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"], optional = true }

[dev-dependencies]
lockgate-schema = { version = "0.1.0", path = "../lockgate-schema" }
