[package]
name = "lockgate-policy"
version.workspace = true
edition.workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
lockgate-macros = { version = "0.1.0", path = "../lockgate-macros" }
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }
url.workspace = true

[dev-dependencies]
lockgate-schema = { version = "0.1.0", path = "../lockgate-schema" }
proptest = "1"
serde_json = "1"
trybuild = "1"
