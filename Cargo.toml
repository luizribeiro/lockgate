[package]
name = "lockgate"
version = "0.1.0"
edition = "2024"
description = "Capability-scoped WebAssembly component applications"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md"]

[workspace]
resolver = "3"
members = ["examples/demo", "lockgate-macros", "lockgate-schema"]
default-members = ["."]

[dependencies]
anyhow = "1.0.100"
lockgate-macros = { version = "0.1.0", path = "lockgate-macros" }
lockgate-schema = { version = "0.1.0", path = "lockgate-schema" }
sha2 = "0.10.9"
thiserror = "2.0.19"
wasmtime = { version = "47.0.3", features = ["component-model"] }
wasmtime-wasi = "47.0.3"
wit-component = "0.255.0"
wit-parser = "0.255.0"

[dev-dependencies]
wat = "1.255.0"
wit-component = { version = "0.255.0", features = ["dummy-module"] }
