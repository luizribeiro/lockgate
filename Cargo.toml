[workspace]
resolver = "3"
exclude = [
    "crates/lockgate/tests/fixtures/exec-concurrent-guest",
    "crates/lockgate/tests/fixtures/exec-fuel-guest",
    "crates/lockgate/tests/fixtures/exec-guest",
    "crates/lockgate/tests/fixtures/wasi-guest",
    "examples/audit/plugin",
    "examples/configuration/plugin",
    "examples/dispatch/plugin",
    "examples/greeter/plugin",
    "examples/provisioning/plugin",
    "examples/workbench/plugins/counter",
    "examples/workbench/plugins/tidy",
]
members = [
    "crates/lockgate",
    "crates/lockgate-http",
    "crates/lockgate-macros",
    "crates/lockgate-policy",
    "crates/lockgate-schema",
    "crates/lockgate-plugin",
    "crates/lockgate-plugin-macros",
    "examples/audit/host",
    "examples/configuration/host",
    "examples/dispatch/host",
    "examples/greeter/host",
    "examples/provisioning/host",
    "examples/provisioning/policy",
    "examples/workbench/host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytes = "1.11.1"
heck = "0.5.0"
http = "1.5.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = "1.9.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
rustls = { version = "0.23", default-features = false }
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
syn = { version = "2.0.110", features = ["full", "visit"] }
tokio = "1.51.1"
tokio-rustls = { version = "0.26.4", default-features = false }
url = { version = "2.5.8", default-features = false }
wasmtime = { version = "48.0.1", features = ["call-hook", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "48.0.1", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-http = { version = "48.0.1", default-features = false, features = ["component-model-async", "default-send-request", "p3"] }
wasmtime-wit-bindgen = { version = "48.0.1", package = "wasmtime-internal-wit-bindgen", features = ["component-model-async"] }
wasm-encoder = "0.254.0"
wasmparser = "0.254.0"
wit-bindgen = "0.57"
wit-component = "0.254.0"
wit-parser = "0.254.0"
wat = "1.256.0"
webpki-roots = "1.0.7"
