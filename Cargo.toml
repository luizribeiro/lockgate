[workspace]
resolver = "3"
exclude = [
    "crates/lockgate/tests/fixtures/exec-concurrent-guest",
    "crates/lockgate/tests/fixtures/exec-fuel-guest",
    "crates/lockgate/tests/fixtures/exec-guest",
    "examples/audit/plugin",
    "examples/configuration/plugin",
    "examples/dispatch/plugin",
    "examples/greeter/plugin",
    "examples/workbench/plugins/counter",
    "examples/workbench/plugins/tidy",
]
members = [
    "crates/lockgate",
    "crates/lockgate-macros",
    "crates/lockgate-schema",
    "crates/lockgate-plugin",
    "crates/lockgate-plugin-macros",
    "examples/audit/host",
    "examples/configuration/host",
    "examples/dispatch/host",
    "examples/greeter/host",
    "examples/workbench/host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
heck = "0.5.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
syn = { version = "2.0.110", features = ["full"] }
tokio = "1.51.1"
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "45af25f4984d14c65663ed43541d2e641752f66d", features = ["component-model", "component-model-async"] }
wasmtime-wit-bindgen = { git = "https://github.com/bytecodealliance/wasmtime", rev = "45af25f4984d14c65663ed43541d2e641752f66d", package = "wasmtime-internal-wit-bindgen", features = ["component-model-async"] }
wasm-encoder = "0.254.0"
wasmparser = "0.254.0"
wit-bindgen = "0.57"
wit-component = "0.254.0"
wit-parser = "0.254.0"
wat = "1.256.0"
